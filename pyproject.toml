[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm-coach"
version = "7.11.0"
description = "国赛(CUMCM)智能论文生成系统 — 题型识别 + 金标准内核 + 多求解器路由 + L1-L4 四级评审"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tianguangpu" }]
keywords = [
    "cumcm",
    "mathematical-modeling",
    "latex",
    "typst",
    "optimization",
    "sensitivity-analysis",
    "claude-skill",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

# 核心依赖：任何使用场景都需要
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
# 求解器：LP/MIP/CSP 路由时使用
solvers = [
    "highspy>=1.7.0",
    "pulp>=2.7.0",
    "ortools>=9.6.2534",
]
# 全局灵敏度分析(Sobol / Morris / FAST)
sensitivity = ["SALib>=1.4.0"]
# 出版级图表样式(Nature / Science / IEEE)
viz = ["scienceplots>=2.1.0"]
# 文献检索与 Typst 参考文献解析
docs = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
]
# 全部可选功能
full = [
    "highspy>=1.7.0",
    "pulp>=2.7.0",
    "ortools>=9.6.2534",
    "SALib>=1.4.0",
    "scienceplots>=2.1.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
]
# 开发依赖
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]
# 时序预测完整版(TAM 需单独安装)
prediction = ["tam>=0.1.0"]

[project.urls]
Homepage = "https://github.com/tianguangpu/cumcm-coach"
Repository = "https://github.com/tianguangpu/cumcm-coach"
"Bug Tracker" = "https://github.com/tianguangpu/cumcm-coach/issues"
Changelog = "https://github.com/tianguangpu/cumcm-coach/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["algorithms*", "utils*"]

[tool.setuptools.package-data]
algorithms = ["*.md"]

# ---------------- 工具配置 ----------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "slow: 耗时较长的端到端测试",
    "smoke: 冒烟测试",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # 行长由 formatter 控制
    "B008",   # 函数默认参数中调用函数（argparse 等常见用法）
    "SIM108",  # 三元表达式非强制
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
