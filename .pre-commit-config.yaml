# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# 代码风格配置统一在 pyproject.toml（[tool.ruff] / [tool.black] / [tool.pytest.ini_options]），
# 此处只声明钩子，不再重复参数，避免两处配置漂移。

repos:
  # ---- Ruff：统一替代 black + flake8 + isort ----
  # 注：暂不启用 ruff-format。ruff 0.16.x 在 ecology/game/mechanistic/misc/stats
  # 等含多字节字符的文件上会触发 Rust panic（上游 bug，非本项目代码问题）。
  # 待上游修复后启用；当前可用 `make format` 手动格式化。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # ---- 通用文件卫生检查 ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---- 本地钩子 ----
  - repo: local
    hooks:
      # 推送前跑算法冒烟测试（提交时跑太慢，放 pre-push）
      - id: pytest-smoke
        name: 算法冒烟测试
        entry: python -m pytest tests/test_algorithms_smoke.py -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 提交时检查 Python 语法
      - id: python-syntax-check
        name: Python 语法检查
        entry: python -m py_compile
        language: system
        types: [python]
        pass_filenames: true
